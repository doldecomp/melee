name: build
run-name: Build Melee & publish GitHub Pages

on: [push, pull_request]

env:
  IMAGE_REPO: doldecomp/melee

permissions:
  contents: read
  id-token: write
  packages: read
  pages: write

jobs:
  build-ninja:
    name: Ninja
    runs-on: ubuntu-latest
    if: github.repository == 'doldecomp/melee'
    container: ghcr.io/doldecomp/melee-build:main
    strategy:
      fail-fast: false
      matrix:
        version: [GALE01]
        mode: ['link', 'diff', 'test', 'clang']
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 2
        sparse-checkout: |
          src/
          extern/
          tools/
          config/
          .github/scripts/
    - name: Git config
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global advice.detachedHead false
    - name: Prepare
      run: ln -s /orig .
    - name: Build
      run: |
        set -eou pipefail
        export RUST_LOG=error

        mode='${{matrix.mode}}'
        root='build/${{matrix.version}}'
        report="$root/report.json"
        head="$(git rev-parse HEAD)"

        function get_upstream {
            local ref
            case '${{github.event_name}}' in
              'pull_request')
                git fetch origin HEAD
                ref='FETCH_HEAD'
              ;;
              'push')
                ref='HEAD^'
              ;;
              *) exit 1 ;;
            esac
            git rev-parse "$ref"
        }
        upstream="$(get_upstream)"

        config_args=$(printf '%s ' \
          '--compilers /compilers' \
          '--max-errors 0' \
          '--verbose' \
          '--version ${{matrix.version}}' \
          '--sym off')

        function run_configure {
          echo "$config_args" | xargs python configure.py
        }

        function checkout {
          git switch --discard-changes --detach "$1"
        }


        case "$mode" in
          'link')
            config_args=$(printf '%s ' \
              '--map' \
              '--require-protos' \
              '--reloc-diffs none' \
              "$config_args")

            run_configure

            set +e

            ninja

            result="$?"

            while IFS= read -r line; do
                echo "$line"
                if [[ "$line" == *"ERROR"* ]]; then
                  result=1
                fi
            done < <(ninja diff)

            if [ "$result" -eq 0 ]; then
                set +e
                python .github/scripts/check_complete.py "$report"
                set -e
            fi

            exit "$result"
          ;;
          'diff')
            expected="$root/baseline.json"
            changes="$root/changes.json"

            function run_ninja {
              ninja all_source "$report"
            }

            checkout "$upstream"
            run_configure
            run_ninja
            cp "$report" "$expected"

            checkout "$head"
            run_ninja

            build/tools/objdiff-cli report changes -o "$changes" "$expected" "$report"
            set +e
            python .github/scripts/diff_changes.py "$changes"
            set -e
          ;;
          'test')
            config_args=$(printf '%s ' \
              '--testing' \
              "$config_args")

            run_configure
            ninja
          ;;
          'clang')
            config_args=""

            # TODO: Migrate to nix and install to environment
            apk add --update --no-cache clang-extra-tools jq

            run_configure

            ninja 'build/${{matrix.version}}/config.json'

            jq -r --arg root "$(realpath .)" \
              '.[] | select(.file | startswith($root + "/src/")) | .file' \
              compile_commands.json |
              xargs -P $(nproc) -I {} sh -c '
                echo "Checking: {}"
                clang-check -p . \
                  -extra-arg=-fno-caret-diagnostics \
                  -extra-arg=-fdiagnostics-format=clang \
                  "{}"
              '
          ;;
          *) exit 1 ;;
        esac
    - name: Upload map
      if: matrix.mode == 'link'
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.version}}_maps
        path: build/${{matrix.version}}/**/*.MAP
    - name: Upload report
      if: matrix.mode == 'diff' && (success() || failure())
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.version}}_report
        path: build/${{matrix.version}}/report.json

  gen-pages:
    name: Generate pages
    runs-on: ubuntu-latest
    needs: build-ninja
    env:
      REGISTRY: ghcr.io
      OUTPUT: ${{github.workspace}}/output
    steps:
      - name: Get image name
        env:
          IMAGE_SUFFIX: gen-pages:latest
        run: |
          echo "IMAGE=$IMAGE_REPO/$IMAGE_SUFFIX" >> $GITHUB_ENV

      - name: Checkout Melee repository
        uses: actions/checkout@v6

      - name: Log into container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull generator image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Generate pages
        run: |
          mkdir -p "${{ env.OUTPUT }}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/input:ro" \
            --volume "${{ env.OUTPUT }}:/output" \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.OUTPUT }}

  deploy-pages:
    concurrency:
      group: deploy
      cancel-in-progress: false
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: gen-pages
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  native-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: doldecomp-melee
    - run: nix build .#melee-gcc-native -L

  build-nix:
    name: Nix
    runs-on: ubuntu-latest
    if: github.repository == 'doldecomp/melee' || github.repository == 'r-burns/doldecomp-melee'
    env:
      REGISTRY: ghcr.io
      IMAGE: doldecomp/melee-build:main
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Log into container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/install-nix-action@v31
    - name: Grab Melee DOL
      run: |
        image="$REGISTRY/$IMAGE"
        docker pull "$image"
        container_id=$(docker create "$image")
        docker cp "$container_id":/orig .
        nix-store --add-fixed sha256 orig/GALE01/sys/main.dol
    - uses: cachix/cachix-action@v17
      with:
        name: doldecomp-melee
    - run: |
        CACHIX_AUTH_TOKEN=${{ secrets.CACHIX_AUTH_TOKEN }} cachix watch-exec doldecomp-melee -- nix develop
    - run: nix flake check
    - run: nix develop --command ninja

  update-wiki:
    name: Update wiki TU list
    runs-on: ubuntu-latest
    needs: build-ninja
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      github.repository == 'doldecomp/melee'
    permissions:
      contents: write
      actions: read
    concurrency:
      group: update-wiki
      cancel-in-progress: false
    steps:
    - name: Checkout Melee repository
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          tools/
          reqs/
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install generator dependencies
      run: pip install -r reqs/misc.txt
    - name: Download report
      uses: actions/download-artifact@v4
      with:
        name: GALE01_report
        path: report
    - name: Regenerate and push the Translation Units page
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        repo='${{ github.repository }}'
        page='Translation-Units.md'

        # GITHUB_TOKEN with `contents: write` can push to this repo's own wiki.
        git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.wiki.git" wiki

        python tools/wiki_tu.py write report/report.json "wiki/${page}" > "wiki/${page}.new"
        mv "wiki/${page}.new" "wiki/${page}"

        cd wiki
        if git diff --quiet -- "${page}"; then
          echo 'Translation Units page already up to date.'
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add "${page}"
        git commit -m "Update Translation Units list for ${{ github.sha }}"
        git push origin HEAD:master
