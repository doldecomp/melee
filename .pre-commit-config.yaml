repos:
- repo: https://github.com/cpp-linter/cpp-linter-hooks
  rev: v1.6.0
  hooks:
    - id: clang-format
      types_or: [file]
      files: \.(c|h|dox)$
    - id: clang-tidy
      files: ^src/
      args: [-p=.,--fix,--fix-errors]
- repo: local
  hooks:
    - id: style-check
      name: style-check
      entry: python tools/check/main.py --fix --quiet
      language: system
      pass_filenames: true
      types_or: [c]
- repo: https://github.com/editorconfig-checker/editorconfig-checker.python
  rev: 3.11.1
  hooks:
    - id: editorconfig-checker
