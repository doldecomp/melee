repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v22.1.8
  hooks:
  - id: clang-format
    types_or: [file]
    files: \.(c|h|dox)$
- repo: https://github.com/editorconfig-checker/editorconfig-checker.python
  rev: 3.11.1
  hooks:
    - id: editorconfig-checker
- repo: local
  hooks:
    - id: style-check
      name: style-check
      entry: python tools/check/main.py --fix --quiet
      language: system
      pass_filenames: true
      types_or: [c]
    - id: clang-check
      name: clang-check
      entry: clang-check --args="-p=. -extra-arg=-fno-caret-diagnostics -extra-arg=-fdiagnostics-format=clang"
      language: python
      additional_dependencies: ["clang-tools"]
      types_or: [c]
      files: ^src/
