[package]
name = "melee-dat"
version = "0.1.0"
edition = "2024"
authors = ["Robin Avery <robin@ribbanya.dev>"]
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
object = { version = "0.40.0", features = ["write"] }
winnow = { version = "1.0.4", features = ["binary"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
typed-path = "0.12"
ignore = "0.4.33"
log = "0.4.34"
env_logger = "0.11.11"
pathdiff = "0.2.3"
rayon = "1.12.0"
serde_json = "1.0.151"
thiserror = "2.0.20"
aho-corasick = "1.1.5"
globset = "0.4.20"
jwalk = "0.9.0"
gimli = "0.34"
string-interner = "0.20.0"
postcard = { version = "1.1.3", features = ["use-std"] }
